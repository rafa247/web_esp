name: Compilar y Publicar ESP 2.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar archivos y compilar esp.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-ChildItem -Directory -Recurse -Filter "src" | Select-Object -First 1
          $inc = Get-ChildItem -Directory -Recurse -Filter "include" | Select-Object -First 1

          if (-not $src -or -not $inc) {
            Write-Host "Contenido actual del repositorio:"
            Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
            throw "No se encontraron las carpetas 'src' o 'include'."
          }

          New-Item -ItemType Directory -Force -Path "$($inc.FullName)\esp", "build", "dist\ESP-2.0.0-win64" | Out-Null

          if (-not (Test-Path "$($inc.FullName)\esp\regex_mod.hpp")) {
            @'
#pragma once
#include "valor.hpp"
#include <memory>
#include <string>
namespace esp {
std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias = "re");
}
'@ | Set-Content -Encoding UTF8 "$($inc.FullName)\esp\regex_mod.hpp"
          }

          if (-not (Test-Path "$($src.FullName)\regex_mod.cpp")) {
            @'
#include "esp/regex_mod.hpp"
#include "esp/runtime.hpp"
namespace esp {
std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias) {
    auto m = std::make_shared<Modulo>();
    m->nombre = nombre_alias;
    m->version = VERSION;
    m->entorno = std::make_shared<Entorno>();
    return m;
}
}
'@ | Set-Content -Encoding UTF8 "$($src.FullName)\regex_mod.cpp"
          }

          $cppFiles = Get-ChildItem "$($src.FullName)\*.cpp" | ForEach-Object { $_.FullName }
          Write-Host "Compilando $($cppFiles.Count) archivos con g++ preinstalado..."
          & g++ -std=c++17 -O2 -I"$($inc.FullName)" $cppFiles -o "build\esp.exe" -lws2_32 -liphlpapi -lbcrypt -static

          Copy-Item "build\esp.exe" "dist\ESP-2.0.0-win64\esp.exe" -Force
          @'
@echo off
title Instalador ESP 2.0.0
if not exist "C:\Program Files\ESP" mkdir "C:\Program Files\ESP"
copy /Y "%~dp0esp.exe" "C:\Program Files\ESP\esp.exe" >nul
powershell -Command "[Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path', 'User') + ';C:\Program Files\ESP', 'User')"
echo [OK] ESP 2.0.0 instalado y agregado al PATH.
pause
'@ | Set-Content -Encoding ASCII "dist\ESP-2.0.0-win64\instalar.bat"

          Compress-Archive -Path "dist\ESP-2.0.0-win64\*" -DestinationPath "dist\ESP-2.0.0-win64.zip" -Force

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ESP 2.0.0 — Windows 64-bit"
          files: dist/ESP-2.0.0-win64.zip
