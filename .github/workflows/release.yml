name: Compilar y Publicar ESP 2.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Organizar carpetas originales y compilar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Detectar si los archivos estan en carpetas o sueltos en la raiz
          $incDir = Get-ChildItem -Directory -Recurse -Filter "include" | Select-Object -First 1
          $srcDir = Get-ChildItem -Directory -Recurse -Filter "src" | Select-Object -First 1

          if ($incDir -and $srcDir) {
            $I_FLAG = $incDir.FullName
            $CPP_FILES = Get-ChildItem "$($srcDir.FullName)\*.cpp" | Where-Object { $_.Name -notmatch '^test_' } | ForEach-Object { $_.FullName }
          } else {
            # Si se subieron sueltos a la raiz, reconstruir include/esp y src sin alterar el contenido
            New-Item -ItemType Directory -Force -Path "build\include\esp", "build\src" | Out-Null
            Get-ChildItem -Filter "*.hpp" | ForEach-Object {
              Copy-Item $_.FullName "build\include\esp\$($_.Name)" -Force
              Copy-Item $_.FullName "build\include\$($_.Name)" -Force
            }
            Get-ChildItem -Filter "*.cpp" | Where-Object { $_.Name -notmatch '^test_' } | ForEach-Object {
              Copy-Item $_.FullName "build\src\$($_.Name)" -Force
            }
            $I_FLAG = "build\include"
            $CPP_FILES = Get-ChildItem "build\src\*.cpp" | ForEach-Object { $_.FullName }
          }

          New-Item -ItemType Directory -Force -Path "build", "dist\ESP-2.0.0-win64" | Out-Null

          Write-Host "Compilando $($CPP_FILES.Count) archivos originales..."
          & g++ -std=c++17 -O1 -fmax-errors=5 -I"$I_FLAG" $CPP_FILES -o "build\esp.exe" -lws2_32 -liphlpapi -lbcrypt -static

          if (-not (Test-Path "build\esp.exe")) {
            throw "Fallo la compilacion."
          }

          Copy-Item "build\esp.exe" "dist\ESP-2.0.0-win64\esp.exe" -Force
          Compress-Archive -Path "dist\ESP-2.0.0-win64\*" -DestinationPath "dist\ESP-2.0.0-win64.zip" -Force

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ESP 2.0.0 — Windows 64-bit"
          files: dist/ESP-2.0.0-win64.zip
