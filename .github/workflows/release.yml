name: Compilar y Publicar ESP 2.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nsis

      - name: Preparar archivos y compilar esp.exe
        shell: msys2 {0}
        run: |
          set -e
          echo "=== Estructura del repositorio ==="
          find . -maxdepth 3 -not -path '*/.*'

          # Detectar si src esta en la raiz o en una subcarpeta
          SRC_DIR=$(find . -type d -name "src" | head -n 1)
          INC_DIR=$(find . -type d -name "include" | head -n 1)

          if [ -z "$SRC_DIR" ] || [ -z "$INC_DIR" ]; then
            echo "ERROR: No se encontraron las carpetas 'src' o 'include' en el repositorio."
            exit 1
          fi

          mkdir -p "$INC_DIR/esp" build

          # Crear regex_mod si no fue subido
          if [ ! -f "$INC_DIR/esp/regex_mod.hpp" ]; then
            cat << 'EOF' > "$INC_DIR/esp/regex_mod.hpp"
          #pragma once
          #include "valor.hpp"
          #include <memory>
          #include <string>
          namespace esp {
          std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias = "re");
          }
          EOF
          fi

          if [ ! -f "$SRC_DIR/regex_mod.cpp" ]; then
            cat << 'EOF' > "$SRC_DIR/regex_mod.cpp"
          #include "esp/regex_mod.hpp"
          #include "esp/runtime.hpp"
          #include <map>
          #include <mutex>
          #include <regex>
          namespace esp {
          std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias) {
              auto m = std::make_shared<Modulo>();
              m->nombre = nombre_alias;
              m->version = VERSION;
              m->entorno = std::make_shared<Entorno>();
              return m;
          }
          }
          EOF
          fi

          echo "=== Compilando archivos desde $SRC_DIR ==="
          g++ -std=c++17 -O2 -I"$INC_DIR" "$SRC_DIR"/*.cpp -o build/esp.exe -lws2_32 -liphlpapi -lbcrypt -static

      - name: Crear instalador NSIS
        shell: msys2 {0}
        run: |
          set -e
          cat << 'EOF' > installer.nsi
          Name "ESP 2.0.0"
          OutFile "ESP-2.0.0-win64.exe"
          InstallDir "$PROGRAMFILES64\ESP"
          RequestExecutionLevel admin

          Page directory
          Page instfiles

          Section "Instalar ESP"
            SetOutPath "$INSTDIR"
            File "build\esp.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            nsExec::ExecToLog 'powershell -Command "[Environment]::SetEnvironmentVariable(\"Path\", [Environment]::GetEnvironmentVariable(\"Path\", \"Machine\") + \";$INSTDIR\", \"Machine\")"'
          SectionEnd

          Section "Uninstall"
            Delete "$INSTDIR\esp.exe"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
          SectionEnd
          EOF
          makensis installer.nsi

      - name: Subir instalador a Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ESP 2.0.0 — Instalador Oficial para Windows"
          files: ESP-2.0.0-win64.exe
