name: Compilar y Publicar ESP 2.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Normalizar cabeceras, compilar y empaquetar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "build\include\esp", "build\src", "dist\ESP-2.0.0-win64" | Out-Null

          Get-ChildItem -Recurse -Filter "*.hpp" | ForEach-Object {
            Copy-Item $_.FullName "build\include\esp\$($_.Name)" -Force
            Copy-Item $_.FullName "build\include\$($_.Name)" -Force
          }
          Get-ChildItem -Recurse -Filter "*.cpp" | Where-Object { $_.Name -notmatch '^test_' } | ForEach-Object {
            Copy-Item $_.FullName "build\src\$($_.Name)" -Force
          }

          # 1. Truncar ast.hpp antes de su segunda copia duplicada
          $astLines = Get-Content "build\include\esp\ast.hpp"
          $seenTipoNodo = $false
          $cleanAst = @()
          foreach ($line in $astLines) {
            if ($line -match 'enum class TipoNodo') {
              if ($seenTipoNodo) { break }
              $seenTipoNodo = $true
            }
            $cleanAst += $line
          }
          Set-Content -Encoding UTF8 -Path "build\include\esp\ast.hpp" -Value $cleanAst
          Set-Content -Encoding UTF8 -Path "build\include\ast.hpp" -Value $cleanAst

          # 2. En comun.hpp: conservar Ubicacion y todo el resto, pero eliminar TipoToken y Token duplicados
          if ((Test-Path "build\include\esp\comun.hpp") -and (Test-Path "build\include\esp\lexer.hpp")) {
            $comunRaw = Get-Content "build\include\esp\comun.hpp" -Raw
            $comunRaw = [regex]::Replace($comunRaw, '(?s)enum\s+class\s+TipoToken\s*\{.*?\};', '')
            $comunRaw = [regex]::Replace($comunRaw, '(?s)struct\s+Token\s*\{.*?\};', '')
            if ($comunRaw -notmatch 'struct\s+Ubicacion') {
              $ubiDef = 'struct Ubicacion { std::string archivo; size_t linea = 1; size_t columna = 1; };' + "`n"
              $comunRaw = $comunRaw -replace '(namespace\s+esp\s*\{)', "`$1`n$ubiDef"
            }
            Set-Content -Encoding UTF8 -Path "build\include\esp\comun.hpp" -Value $comunRaw
            Set-Content -Encoding UTF8 -Path "build\include\comun.hpp" -Value $comunRaw

            # Asegurar pos_ y KwFuncion en lexer.hpp
            $lexText = Get-Content "build\include\esp\lexer.hpp" -Raw
            if ($lexText -notmatch 'KwFuncion') {
              $lexText = $lexText -replace '(enum\s+class\s+TipoToken\s*\{)', "`$1`n    KwFuncion,"
            }
            if ($lexText -notmatch 'pos_') {
              $lexText = $lexText -replace '(size_t\s+indice_\s*=\s*0;)', '$1 size_t pos_ = 0;'
              if ($lexText -notmatch 'pos_') {
                $lexText = $lexText -replace '(std::string\s+fuente_;)', '$1 size_t pos_ = 0;'
              }
            }
            Set-Content -Encoding UTF8 -Path "build\include\esp\lexer.hpp" -Value $lexText
            Set-Content -Encoding UTF8 -Path "build\include\lexer.hpp" -Value $lexText
          }

          # 3. Alinear llamada en main.cpp
          if (Test-Path "build\src\main.cpp") {
            $mainText = Get-Content "build\src\main.cpp" -Raw
            $mainText = $mainText -replace 'return\s+esp::ejecutar_cli\s*\(\s*args\s*\)\s*;', 'return esp::ejecutar_cli(argc, argv);'
            Set-Content -Encoding UTF8 -Path "build\src\main.cpp" -Value $mainText
          }

          $cppList = Get-ChildItem "build\src\*.cpp" | ForEach-Object { $_.FullName }
          Write-Host "Compilando $($cppList.Count) archivos limpios..."
          & g++ -std=c++17 -O1 -fmax-errors=5 -I"build\include" $cppList -o "build\esp.exe" -lws2_32 -liphlpapi -lbcrypt -static

          if (-not (Test-Path "build\esp.exe")) {
            throw "Fallo la compilacion."
          }

          Copy-Item "build\esp.exe" "dist\ESP-2.0.0-win64\esp.exe" -Force
          $batLines = @(
            '@echo off',
            'title Instalador ESP 2.0.0',
            'if not exist "C:\Program Files\ESP" mkdir "C:\Program Files\ESP"',
            'copy /Y "%~dp0esp.exe" "C:\Program Files\ESP\esp.exe" >nul',
            'powershell -Command "[Environment]::SetEnvironmentVariable(''Path'', [Environment]::GetEnvironmentVariable(''Path'', ''User'') + '';C:\Program Files\ESP'', ''User'')"',
            'echo [OK] ESP 2.0.0 instalado y agregado al PATH.',
            'pause'
          )
          Set-Content -Encoding ASCII -Path "dist\ESP-2.0.0-win64\instalar.bat" -Value $batLines

          Compress-Archive -Path "dist\ESP-2.0.0-win64\*" -DestinationPath "dist\ESP-2.0.0-win64.zip" -Force

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ESP 2.0.0 — Windows 64-bit"
          files: dist/ESP-2.0.0-win64.zip
