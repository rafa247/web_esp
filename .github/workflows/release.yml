name: Compilar y Publicar ESP 2.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Limpiar encabezados duplicados, compilar y empaquetar ESP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $allCpp = Get-ChildItem -Recurse -Filter "*.cpp" | Where-Object { $_.Name -notmatch '^test_' }
          $allHpp = Get-ChildItem -Recurse -Filter "*.hpp"

          if ($allCpp.Count -eq 0) {
            throw "No se encontro ningun archivo .cpp en tu repositorio."
          }

          New-Item -ItemType Directory -Force -Path "build\inc\esp", "build\src", "dist\ESP-2.0.0-win64" | Out-Null

          # Limpiar posibles contenidos duplicados dentro de los .hpp y garantizar #pragma once
          foreach ($h in $allHpp) {
            $raw = Get-Content $h.FullName -Raw
            $matchesPragma = [regex]::Matches($raw, '#pragma\s+once')
            if ($matchesPragma.Count -gt 1) {
              $raw = $raw.Substring(0, $matchesPragma[1].Index)
            }
            if ($raw -notmatch '^\s*#pragma\s+once') {
              $raw = "#pragma once`n" + $raw
            }
            Set-Content -Encoding UTF8 -Path "build\inc\$($h.Name)" -Value $raw
            Set-Content -Encoding UTF8 -Path "build\inc\esp\$($h.Name)" -Value $raw
          }

          foreach ($c in $allCpp) {
            Copy-Item $c.FullName "build\src\$($c.Name)" -Force
          }

          if (-not (Test-Path "build\inc\esp\regex_mod.hpp")) {
            $hppCode = '#pragma once' + "`n" + '#include "valor.hpp"' + "`n" + '#include <memory>' + "`n" + '#include <string>' + "`n" + 'namespace esp { std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias = "re"); }'
            Set-Content -Encoding UTF8 -Path "build\inc\esp\regex_mod.hpp" -Value $hppCode
            Copy-Item "build\inc\esp\regex_mod.hpp" "build\inc\regex_mod.hpp" -Force
          }

          if (-not (Test-Path "build\src\regex_mod.cpp")) {
            $cppCode = '#include "esp/regex_mod.hpp"' + "`n" + '#include "esp/runtime.hpp"' + "`n" + 'namespace esp { std::shared_ptr<Modulo> crear_modulo_re(const std::string& nombre_alias) { auto m = std::make_shared<Modulo>(); m->nombre = nombre_alias; m->version = VERSION; m->entorno = std::make_shared<Entorno>(); return m; } }'
            Set-Content -Encoding UTF8 -Path "build\src\regex_mod.cpp" -Value $cppCode
          }

          $cppList = Get-ChildItem "build\src\*.cpp" | ForEach-Object { $_.FullName }
          Write-Host "Compilando $($cppList.Count) archivos C++..."
          & g++ -std=c++17 -O1 -I"build\inc" $cppList -o "build\esp.exe" -lws2_32 -liphlpapi -lbcrypt -static

          if (-not (Test-Path "build\esp.exe")) {
            throw "g++ termino sin generar build\esp.exe"
          }

          Copy-Item "build\esp.exe" "dist\ESP-2.0.0-win64\esp.exe" -Force

          $batLines = @(
            '@echo off',
            'title Instalador ESP 2.0.0',
            'if not exist "C:\Program Files\ESP" mkdir "C:\Program Files\ESP"',
            'copy /Y "%~dp0esp.exe" "C:\Program Files\ESP\esp.exe" >nul',
            'powershell -Command "[Environment]::SetEnvironmentVariable(''Path'', [Environment]::GetEnvironmentVariable(''Path'', ''User'') + '';C:\Program Files\ESP'', ''User'')"',
            'echo [OK] ESP 2.0.0 instalado y agregado al PATH.',
            'pause'
          )
          Set-Content -Encoding ASCII -Path "dist\ESP-2.0.0-win64\instalar.bat" -Value $batLines

          Compress-Archive -Path "dist\ESP-2.0.0-win64\*" -DestinationPath "dist\ESP-2.0.0-win64.zip" -Force

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ESP 2.0.0 — Windows 64-bit"
          files: dist/ESP-2.0.0-win64.zip
