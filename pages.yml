name: Publicar sitio ESP en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generar índice de módulos
        run: node site/scripts/build-registry.js
      - name: Preparar artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar sitio
        id: publicar
        uses: actions/deploy-pages@v4
